<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <rect width="600" height="340" rx="12" fill="#0B132B"/>

  <!-- Network Circuit Lines -->
  <path d="M 50 170 H 550" stroke="#165DFF" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 150 70 V 270" stroke="#165DFF" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 450 70 V 270" stroke="#165DFF" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Central Router Node -->
  <circle cx="300" cy="170" r="38" fill="#0F3460" stroke="#165DFF" stroke-width="3"/>
  <rect x="282" y="156" width="36" height="28" rx="4" fill="#1E293B" stroke="#38BDF8"/>
  <text x="288" y="174" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#38EF7D">R1</text>
  <text x="270" y="222" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93C5FD">192.168.1.1/24</text>

  <!-- Node 1 (Subnet A) -->
  <rect x="70" y="60" width="160" height="85" rx="8" fill="#111B35" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="82" y="82" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#60A5FA">Subnet A: /26</text>
  <text x="82" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#CBD5E1">Net: 192.168.1.0/26</text>
  <text x="82" y="116" font-family="'JetBrains Mono', monospace" font-size="9" fill="#CBD5E1">Hosts: 62 Usable</text>
  <text x="82" y="132" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399">Latency: 1.4ms (OK)</text>

  <!-- Node 2 (Subnet B) -->
  <rect x="370" y="60" width="160" height="85" rx="8" fill="#111B35" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="382" y="82" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#60A5FA">Subnet B: /26</text>
  <text x="382" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#CBD5E1">Net: 192.168.1.64/26</text>
  <text x="382" y="116" font-family="'JetBrains Mono', monospace" font-size="9" fill="#CBD5E1">Hosts: 62 Usable</text>
  <text x="382" y="132" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399">Latency: 2.1ms (OK)</text>

  <!-- Bottom CLI Terminal Output -->
  <rect x="50" y="240" width="500" height="75" rx="6" fill="#030712" stroke="#374151" stroke-width="1"/>
  <text x="65" y="260" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38EF7D">$ ./netcalc --cidr 192.168.1.0/24 --split 2</text>
  <text x="65" y="278" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9CA3AF">[CIDR Result] Netmask: 255.255.255.192 | Wildcard: 0.0.0.63</text>
  <text x="65" y="296" font-family="'JetBrains Mono', monospace" font-size="9" fill="#60A5FA">[ICMP Probe] Pinging 192.168.1.1 - 4 packets transmitted, 0% loss</text>
</svg>

