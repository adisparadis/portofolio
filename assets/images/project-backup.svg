  <text x="265" y="204" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6EE7B7">ENCRYPTED</text>
  <path d="M 350 165 L 410 165" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>

