<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3460"/>
      <stop offset="100%" stop-color="#165DFF"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#11998E" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="100" cy="100" r="95" fill="#0B132B" stroke="url(#bgGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="85" fill="#111B35"/>

  <!-- Tech Grid Lines in Background -->
  <path d="M40 70 H160 M40 100 H160 M40 130 H160" stroke="#165DFF" stroke-opacity="0.15" stroke-dasharray="3,3"/>
  <path d="M70 40 V160 M100 40 V160 M130 40 V160" stroke="#165DFF" stroke-opacity="0.15" stroke-dasharray="3,3"/>

  <!-- Developer Silhouette with Tech Elements -->
  <!-- Hoodie / Shoulders -->
  <path d="M45 178 C50 142 70 132 85 130 C88 138 94 142 100 142 C106 142 112 138 115 130 C130 132 150 142 155 178 Z" fill="#0F3460" stroke="#165DFF" stroke-width="2"/>
  
  <!-- Head & Hair -->
  <ellipse cx="100" cy="98" rx="26" ry="32" fill="#E2E8F0"/>
  <!-- Hair Tech Style -->
  <path d="M74 95 C72 75 80 62 100 62 C120 62 128 75 126 95 C121 78 115 72 100 72 C85 72 79 78 74 95 Z" fill="#1E293B"/>

  <!-- Tech Glasses / HUD -->
  <rect x="80" y="90" width="16" height="12" rx="3" fill="#165DFF" fill-opacity="0.4" stroke="#165DFF" stroke-width="2"/>
  <rect x="104" y="90" width="16" height="12" rx="3" fill="#165DFF" fill-opacity="0.4" stroke="#165DFF" stroke-width="2"/>
  <line x1="96" y1="95" x2="104" y2="95" stroke="#165DFF" stroke-width="2"/>

  <!-- Code Symbol Floating -->
  <text x="145" y="70" font-family="monospace" font-size="14" font-weight="bold" fill="#38EF7D">&lt;/&gt;</text>
  <circle cx="150" cy="120" r="3" fill="#165DFF"/>
  <circle cx="50" cy="85" r="4" fill="#38EF7D"/>

  <!-- Terminal prompt accent below -->
  <rect x="75" y="152" width="50" height="14" rx="3" fill="#0B0F19" stroke="#165DFF" stroke-width="1"/>
  <text x="80" y="163" font-family="monospace" font-size="9" fill="#38EF7D">$ ~ it_</text>
  
  <!-- Online status indicator dot -->
  <circle cx="145" cy="145" r="7" fill="#10B981" stroke="#0B132B" stroke-width="2"/>
</svg>

