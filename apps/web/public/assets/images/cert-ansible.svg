  <line x1="140" y1="475" x2="260" y2="475" stroke="#94A3B8" stroke-width="1"/>

  <text x="660" y="445" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#990000">Credential ID:</text>
  <text x="660" y="465" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">ANS-AUTO-40912</text>
  <line x1="540" y1="475" x2="660" y2="475" stroke="#94A3B8" stroke-width="1"/>
