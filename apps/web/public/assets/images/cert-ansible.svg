<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="redSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE0000"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
  </defs>

  <!-- Border & Paper -->
  <rect width="800" height="560" rx="8" fill="url(#certBg)" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="25" y="25" width="750" height="510" rx="4" fill="none" stroke="#990000" stroke-width="4"/>
  <rect x="35" y="35" width="730" height="490" rx="4" fill="none" stroke="#EE0000" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Corner Ornaments -->
  <path d="M 45 45 L 85 45 M 45 45 L 45 85" stroke="#990000" stroke-width="3"/>
  <path d="M 755 45 L 715 45 M 755 45 L 755 85" stroke="#990000" stroke-width="3"/>
  <path d="M 45 515 L 85 515 M 45 515 L 45 475" stroke="#990000" stroke-width="3"/>
  <path d="M 755 515 L 715 515 M 755 515 L 755 475" stroke="#990000" stroke-width="3"/>

  <!-- Header -->
  <text x="400" y="100" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#990000" letter-spacing="4">SERTIFIKAT KOMPETENSI</text>
  <text x="400" y="130" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#64748B" letter-spacing="2">AUTOMATION &amp; CONFIGURATION SPECIALIST</text>

  <line x1="320" y1="145" x2="480" y2="145" stroke="#EE0000" stroke-width="2"/>

  <!-- Presented To -->
