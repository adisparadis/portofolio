  <text x="400" y="240" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="bold" fill="#0F172A">Muhammad Asror</text>
  <line x1="200" y1="260" x2="600" y2="260" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Subject -->
  <text x="400" y="300" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" fill="#334155">Atas keberhasilan menyelesaikan spesialisasi:</text>
  <text x="400" y="340" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#EE0000">Ansible for Infrastructure Automation</text>
  <text x="400" y="375" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">Playbooks, Roles, Jinja2 Templating &amp; Multi-Node Server Orchestration</text>

  <!-- Seal -->
  <circle cx="400" cy="445" r="38" fill="url(#redSeal)" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.2))"/>
  <circle cx="400" cy="445" r="32" fill="none" stroke="#FEE2E2" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="400" y="442" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">PASSED</text>
  <text x="400" y="456" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#FEE2E2">★ 2025 ★</text>

  <!-- Signatures & Verification -->
  <text x="140" y="445" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#990000">Penerbit:</text>
